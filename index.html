    {id:"racha", ic:"🔥", nom:"Semanas seguidas entrenando", val:mx.racha, niv:[2,4,8,12,26,52]},
    {id:"media", ic:"🎖️", nom:"Mejor media (sala/aire libre)", val:mx.mejorMedia, niv:[7,8,8.5,9,9.2,9.5], dec:true},
    {id:"records", ic:"📈", nom:"Récords batidos", val:mx.recordsBatidos, niv:[1,3,5,10,25,50]},
    {id:"equis", ic:"⭐", nom:"Equis (X)", val:mx.equis, niv:[10,50,100,250,500,1000,2500]},
    {id:"dieces", ic:"🔟", nom:"Dieces", val:mx.dieces, niv:[50,100,250,500,1000,2500,5000]},
    {id:"obj", ic:"✅", nom:"Objetivos cumplidos", val:mx.objLogrados, niv:[1,3,5,10,20]},
    {id:"plan", ic:"📅", nom:"Entrenos planificados hechos", val:mx.planHechos, niv:[1,5,10,25,50]},
    {id:"disc", ic:"🧭", nom:"Disciplinas distintas", val:mx.disciplinas, niv:[2,3,4]},
    {id:"patrulla", ic:"👥", nom:"Tiradas en patrulla", val:mx.patrulla, niv:[1,5,10,25]},
  ];
}
function fmtNiv(f,n){ return f.dec? String(n).replace(".",",") : (n>=1000? (n/1000)+"k" : String(n)); }
function paneLogros(m){
  const mx=metricasLogros(); const fams=familiasLogros(mx);
  // Insignia actual de cada familia = su nivel más alto conseguido (acumulativa: sustituye a los anteriores)
  const ganadas=[]; fams.forEach(f=>{ const earned=f.niv.filter(n=>f.val>=n); if(earned.length) ganadas.push({f, n:Math.max(...earned)}); });
  // Retos en curso: el siguiente nivel pendiente de cada familia, ordenados por cercanía
  const retos=fams.map(f=>{ const next=f.niv.find(n=>f.val<n); return next?{f, next, pct:Math.min(1,f.val/next)}:null; })
    .filter(Boolean).sort((a,b)=>b.pct-a.pct);
  let conseguidasLvl=0, totalesLvl=0;
  fams.forEach(f=>{ totalesLvl+=f.niv.length; conseguidasLvl+=f.niv.filter(n=>f.val>=n).length; });
  m.append(h("div",{class:"resumen"},
    caja(ganadas.length,"Insignias"), caja(retos.length,"Retos activos"), caja(Math.round(conseguidasLvl/totalesLvl*100)+"%","Progreso")));
  m.append(h("div",{class:"fila", style:"margin:16px 0 8px"}, h("label",{style:"margin:0"},"Retos en curso")));
  if(!retos.length){
    m.append(h("div",{class:"vacio chico"}, h("div",{class:"muted"}, "¡Has conseguido todas las insignias disponibles! 🏆")));
  } else {
    retos.forEach(r=>{
      const card=h("div",{class:"tarjeta reto-card"});
      card.append(h("div",{class:"fila", style:"justify-content:space-between; gap:8px"},
        h("div",{style:"text-align:left; min-width:0"},
          h("strong",{}, r.f.ic+" "+r.f.nom),
          h("div",{class:"muted sub-mat"}, `${r.f.dec?r.f.val.toFixed(2):r.f.val} / ${fmtNiv(r.f,r.next)}`)),
        h("span",{class:"reto-meta"}, fmtNiv(r.f,r.next))));
      const barra=h("div",{class:"prog"}); barra.append(h("div",{class:"prog-in", style:`width:${Math.round(r.pct*100)}%`})); card.append(barra);
      m.append(card);
    });
  }

  // Insignias conseguidas
  m.append(h("div",{class:"fila", style:"margin:18px 0 8px"}, h("label",{style:"margin:0"},"Insignias conseguidas")));
  if(!ganadas.length){
    m.append(h("div",{class:"vacio chico"}, h("div",{class:"muted"}, "Aún no has conseguido insignias. Registra tiradas y entrenos para empezar a ganarlas.")));
  } else {
    const grid=h("div",{class:"insignias"});
    ganadas.forEach(g=>{
      grid.append(h("div",{class:"insignia", title:g.f.nom}, h("div",{class:"ins-ic"}, g.f.ic),
        h("div",{class:"ins-n"}, fmtNiv(g.f,g.n)), h("div",{class:"ins-t"}, g.f.nom)));
    });
    m.append(grid);
  }
  m.append(h("div",{class:"muted", style:"font-size:.8rem; margin-top:14px"},
    "Las insignias se consiguen solas según vas tirando, entrenando y cumpliendo objetivos. Hay niveles para mucho tiempo: de las primeras 100 flechas hasta 100.000."));
}
function nuevoObjetivo(){ return { id:null, tipo:"MEDIA", disciplina:"SALA", modalidad:"TODAS", valor:"", periodo:"SEMANA", unidad:"TIRADAS" }; }
const TIPOS_OBJ=[["MEDIA","Media"],["PUNTUACION","Puntuación"],["VOLUMEN","Volumen"],["CONSTANCIA","Constancia"]];
function vistaObjetivo(){
  const o=objDraft; if(!o){ ir({nombre:"objetivos"}); return h("main",{}); }
  const m=h("main",{});
  m.append(h("div",{class:"fila", style:"margin-bottom:10px"},
    h("button",{class:"icono-btn", onclick:()=>{ objDraft=null; ir({nombre:"objetivos"}); }}, "‹"),
    h("h2",{style:"margin:0; flex:1"}, o.id?"Editar objetivo":"Nuevo objetivo"),
  ));
  const c=h("div",{class:"tarjeta"});
  c.append(campoSeg("Tipo", TIPOS_OBJ, o.tipo, v=>{ o.tipo=v; render(); }, true));
  if(o.tipo==="MEDIA"||o.tipo==="PUNTUACION"){
    const discs=[["TODAS","Todas"]].concat(Object.keys(DISC).map(k=>[k,DISC[k].nombre]));
    c.append(campoSel("Disciplina", discs, o.disciplina, v=>{ o.disciplina=v; render(); }));
    const mods=[["TODAS","Todas"]].concat(MODALIDADES);
    c.append(campoSel("Modalidad", mods, o.modalidad, v=>{ o.modalidad=v; }));
    c.append(campoTexto(o.tipo==="MEDIA"?"Media objetivo (p. ej. 9,0)":"Puntuación objetivo (total)", o.valor, v=>o.valor=v, "", "number"));
  } else if(o.tipo==="VOLUMEN"){
    c.append(campoSeg("Periodo", [["SEMANA","Semanal"],["MES","Mensual"]], o.periodo, v=>{ o.periodo=v; }));
    c.append(campoSeg("Cuenta", [["TIRADAS","Tiradas"],["FLECHAS","Flechas"]], o.unidad, v=>{ o.unidad=v; }));
    c.append(campoTexto("Cantidad objetivo", o.valor, v=>o.valor=v, "", "number"));
  } else if(o.tipo==="CONSTANCIA"){
    c.append(campoTexto("Días de entreno por semana", o.valor, v=>o.valor=v, "", "number"));
  }
  m.append(c);
  // vista previa del progreso
  if(o.valor){ const p=progresoObjetivo(o);
    const pv=h("div",{class:"tarjeta"}, h("label",{},"Progreso actual"), h("div",{class:"muted sub-mat", style:"margin-bottom:8px"}, p.txt));
    const barra=h("div",{class:"prog"}); barra.append(h("div",{class:"prog-in"+(p.pct>=1?" ok":""), style:`width:${Math.round(p.pct*100)}%`})); pv.append(barra);
    m.append(pv);
  }
  m.append(h("button",{class:"boton", onclick:guardarObjetivo}, o.id?"Guardar cambios":"Crear objetivo"));
  if(o.id){
    m.append(h("button",{class:"boton peligro", style:"margin-top:10px", onclick:async()=>{
      if(await confirmar("¿Eliminar este objetivo?")){ DB.objetivos.lista=DB.objetivos.lista.filter(x=>x.id!==o.id); guardar(); objDraft=null; ir({nombre:"objetivos"}); } }}, "Eliminar objetivo"));
  }
  return m;
}
function guardarObjetivo(){
  const o=objDraft;
  if(o.valor===""||o.valor==null||isNaN(Number(o.valor))||Number(o.valor)<=0){ toast("Indica un valor objetivo válido"); return; }
  o.valor=Number(o.valor);
  if(o.id){ const i=DB.objetivos.lista.findIndex(x=>x.id===o.id); if(i>=0) DB.objetivos.lista[i]=o; }
  else { o.id=DB.objetivos.sig++; DB.objetivos.lista.push(o); }
  guardar(); objDraft=null; toast("Objetivo guardado"); ir({nombre:"objetivos"});
}
function campoSel(lab, opciones, val, onchange){
  return h("div",{class:"campo"}, h("label",{},lab),
    h("select",{onchange:e=>{ onchange(e.target.value); }},
      ...opciones.map(([v,t])=>h("option",{value:v, selected:(String(val)===String(v))||undefined}, t))));
}

/* ───────────────────────── Exportar / importar ───────────────────────── */
function menuDatos(){
  modal("Copia de seguridad de tus tiradas", [
    {t:"⬇  Exportar copia", v:"exp"},
    {t:"⬆  Importar copia", v:"imp"},
    {t:"Cancelar", sec:true, v:null},
  ], v=>{ if(v==="exp") exportar(); else if(v==="imp") importar(); });
}
async function exportar(){
  const datos=JSON.stringify(DB,null,2);
  const filename="diana-score-copia-"+new Date().toISOString().slice(0,10)+".json";
  let dl=null; try{ dl = (window.claude&&claude.use)? await claude.use("downloads") : null; }catch(e){}
  if(dl){ try{ await dl.save({filename, data:datos}); toast("Copia exportada"); }catch(e){ toast("Exportación cancelada"); } return; }
  const blob=new Blob([datos],{type:"application/json"}); const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=filename; a.click(); URL.revokeObjectURL(url); toast("Copia exportada");
}
function importar(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept="application/json,.json";
  inp.onchange=()=>{ const f=inp.files[0]; if(!f) return; const r=new FileReader();
    r.onload=async()=>{ try{ const d=JSON.parse(r.result); if(!d.sesiones) throw 0;
      if(await confirmar("Esto reemplazará los datos actuales por los de la copia. ¿Continuar?")){ if(!d.material) d.material={arcos:[],juegos:[],sig:1}; if(!d.objetivos) d.objetivos={lista:[],sig:1}; if(!d.plan) d.plan={lista:[],sig:1}; DB=d; guardar(); vista={nombre:"inicio"}; render(); toast("Copia importada"); }
    }catch(e){ toast("Archivo no válido"); } };
    r.readAsText(f); };
  inp.click();
}

render();
